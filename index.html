<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Guess Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            background-image: url(dices.webp);
        }

        .game {
            width: 350px;
            padding: 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        h1 {
            margin-top: 0;
            background-color: black;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            font-size: 20px;
            text-align: center;
            border: none;
            border-radius: 10px;
        }

        .dice {
            width: 130px;
            height: 130px;
            margin: 25px auto;
            background: rgb(67, 64, 64);
            color: #222;
            border-radius: 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 80px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        /* Dice rolling animation */
        .rolling {
            animation: roll 0.8s ease-in-out;
        }

        @keyframes roll {

            0% {
                transform: rotateX(0deg)
                           rotateY(0deg)
                           translateY(0);
            }

            25% {
                transform: rotateX(180deg)
                           rotateY(180deg)
                           translateY(-60px);
            }

            50% {
                transform: rotateX(360deg)
                           rotateY(360deg)
                           translateY(0);
            }

            75% {
                transform: rotateX(540deg)
                           rotateY(540deg)
                           translateY(-40px);
            }

            100% {
                transform: rotateX(720deg)
                           rotateY(720deg)
                           translateY(0);
            }
        }

        button {
            width: 100%;
            padding: 14px;

            font-size: 20px;
            font-weight: bold;

            border: none;
            border-radius: 10px;

            background: #ff4757;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #ff6b81;
        }

        button:disabled {
            background: #777;
            cursor: not-allowed;
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            min-height: 30px;
        }

        .win {
            color: #2ed573;
        }

        .loss {
            color: #ff4757;
        }
    </style>
</head>

<body>

    <div class="game">

        <h1>🎲 Dice Guess Game</h1>

        <p>Enter a number between <b>1 and 6</b></p>

        <input
            type="number"
            id="guess"
            min="1"
            max="6"
            placeholder="Enter number"
        >

        <div class="dice" id="dice">⚀</div>

        <button id="rollButton" onclick="rollDice()">
            🎲 Roll Dice
        </button>

        <div id="result">
            Make your guess!
        </div>

    </div>


    <script>

        function rollDice() {

            const input = document.getElementById("guess");
            const dice = document.getElementById("dice");
            const button = document.getElementById("rollButton");
            const result = document.getElementById("result");

            const guess = Number(input.value);

            // Check input
            if (guess < 1 || guess > 6 || !Number.isInteger(guess)) {

                result.className = "loss";
                result.textContent =
                    "⚠️ Please enter a number from 1 to 6.";

                return;
            }

            // Disable button while rolling
            button.disabled = true;

            result.className = "";
            result.textContent = "🎲 Rolling...";

            // Restart animation
            dice.classList.remove("rolling");

            void dice.offsetWidth;

            dice.classList.add("rolling");


            // Generate random dice number
            const diceNumber =
                Math.floor(Math.random() * 6) + 1;


            // Dice faces
            const diceFaces = [
                "⚀",
                "⚁",
                "⚂",
                "⚃",
                "⚄",
                "⚅"
            ];


            // Wait for animation
            setTimeout(function () {

                dice.classList.remove("rolling");

                // Show dice result
                dice.textContent =
                    diceFaces[diceNumber - 1];


                // Check WIN or LOSS
                if (guess === diceNumber) {

                    result.className = "win";

                    result.textContent =
                        "🎉 WIN! You guessed " +
                        guess +
                        " and rolled " +
                        diceNumber +
                        "!";

                } else {

                    result.className = "loss";

                    result.textContent =
                        "❌ LOSS! You guessed " +
                        guess +
                        ", but rolled " +
                        diceNumber +
                        ".";

                }

                // Enable button
                button.disabled = false;

            }, 800);
        }

    </script>

</body>
</html>
